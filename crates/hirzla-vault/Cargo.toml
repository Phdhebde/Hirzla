[package]
name = "hirzla-vault"
description = "Vault file format: lockers, secrets, version history."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hirzla-crypto = { path = "../hirzla-crypto" }
# ADR 0013.
cbor4ii = { version = "1.2.4", default-features = false, features = ["use_alloc"] }
# KDBX 4 import (ADR 0025): protected values (base64), gzip payload, XML document. All three
# were already in the dependency graph (Tauri) and forbid `unsafe` in the code used here.
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
quick-xml = { version = "0.42.0", default-features = false }
icu_normalizer = "2.4.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
thiserror = "2.0"
url = "2.5.8"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
