[package]
name = "hirzla-core"
description = "The core: the only process that ever holds keys."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Delivery build (ADR 0042, 0043; docs/livraison.md): client signatures required and not
# disableable, only the publisher keys compiled in through HIRZLA_PUBLISHER_KEYS accepted.
livraison = []
# Release signature checked against the publisher signature of the operating system instead
# of the client manifest (ADR 0063 § 1): Authenticode on Windows, Apple code signing on macOS.
# Only for a publisher holding such a certificate; the core and its clients must be built with
# the same choice. Never chosen at run time. Without it (default), every build checks the
# client manifest signed by the hybrid publisher key, on every system.
signature-systeme = []
# Exposes the decoder of the unsealed server mode annex to the fuzz targets (`fuzz/`).
# Never enabled in a shipped binary.
fuzzing = []
# FIDO2 security keys over USB HID on Linux and macOS (ADR 0075 § 8): `ctap-hid-fido2`, which
# needs libudev on Linux. Windows always goes through webauthn.dll. Enabled in the shipped core
# on Linux and macOS (release workflow, reproducible build), never in the other executables.
fido2-hid = ["hirzla-keystore/fido2-hid"]

[dependencies]
hirzla-crypto = { path = "../hirzla-crypto" }
hirzla-vault = { path = "../hirzla-vault" }
hirzla-access = { path = "../hirzla-access" }
hirzla-keystore = { path = "../hirzla-keystore" }
hirzla-sync = { path = "../hirzla-sync", features = ["net"] }
thiserror = "2.0"
# Same parser as the vault index hosts (WHATWG URL Standard), already in the graph.
url = "2.5.9"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
# Public Suffix List compiled in, for the relying party identifier of a passkey (ADR 0079
# § 3): no network. Pinned: the list changes with the version, a reviewed change.
psl = { version = "=2.1.258", default-features = false }
# Base64url of the challenge in the passkey `clientDataJSON` (ADR 0079 § 3). Same version as
# hirzla-vault (ADR 0025).
data-encoding = { version = "=2.11.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3.27.0"
# Independent ES256 verification of the passkey signatures (ADR 0079 § 1); tests only.
p256 = { version = "0.14.0", features = ["ecdsa"] }
# In-memory relay and test identities, for the Hornn control plane simulator (tests only).
hirzla-sync = { path = "../hirzla-sync", features = ["net", "test-support"] }
# A second device of the same member for the device revocation test (ADR 0059).
hirzla-vault = { path = "../hirzla-vault", features = ["test-support"] }
# Server mode end-to-end test (ADR 0032): a real hirzlad, its test PKI and its TLS types.
# Same versions and features as apps/server; tests only, never linked into the core.
hirzla-server = { path = "../../apps/server" }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
# Simulated hardware unlock factors (ADR 0075 § 9); tests only.
hirzla-keystore = { path = "../hirzla-keystore", features = ["test-software"] }
