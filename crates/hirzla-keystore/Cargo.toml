[package]
name = "hirzla-keystore"
description = "Hardware-backed key storage: TPM, Secure Enclave, Windows Hello, FIDO2, HSM."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hirzla-crypto = { path = "../hirzla-crypto" }
thiserror = "2.0"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# ADR 0015. Process hardening, peer credentials of the local channel and terminal echo
# (`platform`). Already in the dependency graph; now a direct dependency on Unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# ADR 0014. TPM 2.0 through tpm2-tss (>= 4.1.3, found by pkg-config, see
# .github/scripts/install-tpm2-tss.sh; no
# source download at build time). Windows is not built yet: no released tss-esapi opens the
# TBS TCTI (see docs/keystore-prototypes.md).
[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = "=7.7.0"

# ADR 0014. Secure Enclave, only ever combined with the master password (decision 1).
# OSX_10_15: the data protection keychain, the only one that holds enclave keys.
# security-framework-sys: `SecKeyCreateWithData`, which has no safe wrapper.
# ADR 0042: code signing of the core's clients (`SecCode`, `SecRequirement`), same crates.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
security-framework-sys = "2.17.0"

# ADR 0014, decision 6. DPAPI (CryptProtectData, user scope): a factor always combined with
# the master password, until a released tss-esapi opens the TPM on Windows.
[target.'cfg(windows)'.dependencies]
# ADR 0015: the named pipe of the local channel, the identity of its peer, the process DACL
# and console input without echo (`platform`). ADR 0033: suspend and session-lock
# notifications (Graphics_Gdi, LibraryLoader, Power, RemoteDesktop, UI_WindowsAndMessaging).
# ADR 0042: Authenticode of the core's clients (Security_WinTrust; Cryptography_Catalog and
# Cryptography_Sip only gate the WTHelper* bindings).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
