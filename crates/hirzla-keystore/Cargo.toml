[package]
name = "hirzla-keystore"
description = "Hardware-backed key storage: TPM, Secure Enclave, Windows Hello, FIDO2, HSM."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hirzla-crypto = { path = "../hirzla-crypto" }
thiserror = "2.0"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# ADR 0014. TPM 2.0 through tpm2-tss (system library >= 2.4.6, found by pkg-config; no
# source download at build time). Windows is not built yet: no released tss-esapi opens the
# TBS TCTI (see docs/keystore-prototypes.md).
[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = "=7.7.0"

# ADR 0014. Secure Enclave, only ever combined with the master password (decision 1).
# OSX_10_15: the data protection keychain, the only one that holds enclave keys.
# security-framework-sys: `SecKeyCreateWithData`, which has no safe wrapper.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
security-framework-sys = "2.17.0"
