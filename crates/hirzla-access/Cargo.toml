[package]
name = "hirzla-access"
description = "Roles, signed grants and key transparency."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hirzla-crypto = { path = "../hirzla-crypto" }
# Deterministic CBOR and the shared structures of docs/format.md (ADR 0020): one canonical
# encoder for every signed format, instead of a second copy.
hirzla-vault = { path = "../hirzla-vault" }
thiserror = "2.0"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
proptest = "1.12.0"
# Second SHA-256 implementation, for the RFC 6962 reference Merkle vectors only (ADR 0019).
# Never linked into a shipped binary.
sha2 = "0.11.1"
