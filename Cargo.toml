[workspace]
resolver = "2"
members = [
    "crates/hirzla-crypto",
    "crates/hirzla-vault",
    "crates/hirzla-sync",
    "crates/hirzla-access",
    "crates/hirzla-keystore",
    "crates/hirzla-audit",
    "crates/hirzla-core",
    "apps/cli",
    "apps/native-host",
    "apps/server",
    # Publisher-side signing tool (ADR 0042, 0043): never shipped to workstations.
    "apps/release-signer",
    # Tauri 2 shell (ADR 0024): in the workspace so that the four commands of CLAUDE.md,
    # the single Cargo.lock and cargo-deny cover it. Linux needs webkit2gtk-4.1 to build it.
    "apps/desktop/src-tauri",
    # Android (ADR 0080): the JNI entry point of the core, the one exception to rule 6.
    "apps/mobile/core",
    # Android (ADR 0080 § 8): the interface, Tauri 2; its JNI glue is the second exception.
    "apps/mobile/src-tauri",
]
# Fuzz targets live outside the workspace (nightly, cargo-fuzz).
exclude = ["fuzz"]

[workspace.package]
version = "1.1.2"
edition = "2021"
rust-version = "1.89"
publish = false
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
# `deny`, not `forbid`: hirzla-keystore allows it block by block (ADR 0014). Every other
# crate root declares `#![forbid(unsafe_code)]`, checked by hirzla-keystore/tests/unsafe_policy.rs.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

# Argon2id runs at 64 MiB or more: unoptimised, a single derivation takes tens of seconds
# in debug builds and tests. Optimise only these dependencies.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# AWS-LC (ADR 0009) runs every hybrid signature and encapsulation of the tests. Unoptimised,
# its C code is built in the Debug configuration (MSVC /Od /RTC1 on Windows), where the tests
# of hirzla-sync, hirzla-access and hirzla-audit run 10 to 18 times slower than on Linux.
# Optimise it like argon2: this changes the build profile of tests only, not the code.
[profile.dev.package.aws-lc-sys]
opt-level = 3
