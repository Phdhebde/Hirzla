[workspace]
resolver = "2"
members = [
    "crates/hirzla-crypto",
    "crates/hirzla-vault",
    "crates/hirzla-sync",
    "crates/hirzla-access",
    "crates/hirzla-keystore",
    "crates/hirzla-audit",
    "crates/hirzla-core",
    "apps/cli",
    "apps/server",
]
# Fuzz targets live outside the workspace (nightly, cargo-fuzz).
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false

[workspace.lints.rust]
# `deny`, not `forbid`: hirzla-keystore allows it block by block (ADR 0014). Every other
# crate root declares `#![forbid(unsafe_code)]`, checked by hirzla-keystore/tests/unsafe_policy.rs.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

# Argon2id runs at 64 MiB or more: unoptimised, a single derivation takes tens of seconds
# in debug builds and tests. Optimise only these dependencies.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
