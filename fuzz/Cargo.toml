# Fuzz targets of every decoder exposed to external data (ADR 0013; inventory in
# docs/evaluation/interfaces.md). Outside the workspace: needs nightly and cargo-fuzz.
#   cargo install cargo-fuzz
#   cargo +nightly fuzz run decode_secret_body
# tpm2-tss is not needed: the TPM prototype is behind a feature that is off (ADR 0052).
[package]
name = "hirzla-vault-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
hirzla-vault = { path = "../crates/hirzla-vault", features = ["fuzzing"] }
hirzla-crypto = { path = "../crates/hirzla-crypto" }
hirzla-access = { path = "../crates/hirzla-access" }
hirzla-audit = { path = "../crates/hirzla-audit" }
hirzla-sync = { path = "../crates/hirzla-sync", features = ["net"] }
hirzla-core = { path = "../crates/hirzla-core", features = ["fuzzing"] }
libfuzzer-sys = "0.4"
# For the modules compiled here from source without their crate (`parse_csv`,
# `parse_native_json`): already in the workspace graph, same versions.
thiserror = "2.0"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# Standalone: not a member of the main workspace.
[workspace]

[[bin]]
name = "decode_secret_body"
path = "fuzz_targets/decode_secret_body.rs"
test = false
doc = false
bench = false

