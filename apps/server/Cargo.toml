[package]
name = "hirzla-server"
description = "Hirzla blind server: sync relay, key directory, policies, audit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "hirzlad"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
hirzla-crypto = { path = "../../crates/hirzla-crypto" }
hirzla-vault = { path = "../../crates/hirzla-vault" }
hirzla-access = { path = "../../crates/hirzla-access" }
hirzla-sync = { path = "../../crates/hirzla-sync", features = ["net"] }
hirzla-audit = { path = "../../crates/hirzla-audit" }
# TLS 1.3 of the device and administration channels (ADR 0022, ADR 0028): the AWS-LC
# provider of hirzla-crypto, hybrid groups only, no TLS 1.2, no logging.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
thiserror = "2.0"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
# Members, devices and replicas for the end-to-end tests: real postes, not mocks.
hirzla-sync = { path = "../../crates/hirzla-sync", features = ["net", "test-support"] }
# Test certificates only (the TLS certificate is not the server identity, § 11.1). Never
# linked into the binary.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3.27.0"
