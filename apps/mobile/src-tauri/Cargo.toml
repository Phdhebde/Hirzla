[package]
name = "hirzla-mobile"
description = "Hirzla Android application (Tauri 2, ADR 0080): a client of the core, holds no key."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Tauri loads `libhirzla_mobile.so` in the interface process; the cores run apart, one process
# per vault (`apps/mobile/core`, ADR 0085 step 5).
[lib]
name = "hirzla_mobile"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", default-features = false , features = [] }

[dependencies]
hirzla-core = { path = "../../../crates/hirzla-core" }
hirzla-crypto = { path = "../../../crates/hirzla-crypto" }
hirzla-vault = { path = "../../../crates/hirzla-vault" }
# ADR 0024 and 0080 § 8: same Tauri shell as the desktop application, no plugin.
tauri = { version = "2.12.5", default-features = false, features = ["wry", "custom-protocol", "common-controls-v6", "compression", "x11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["serde"] }

[dev-dependencies]
# Private temporary directories for the end-to-end tests with real cores.
tempfile = "3.27.0"
