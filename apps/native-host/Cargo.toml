[package]
name = "hirzla-native-host"
description = "Native messaging host of the Hirzla browser extension: a client of the core that holds no key."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "hirzla-native-host"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
hirzla-core = { path = "../../crates/hirzla-core" }
hirzla-keystore = { path = "../../crates/hirzla-keystore" }
hirzla-vault = { path = "../../crates/hirzla-vault" }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.27.0"
