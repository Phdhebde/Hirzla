<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Connexion</title></head>
<body>
  <!-- Served at the registered origin (https://bank.test/login) and, unchanged, at every
       origin that must be refused: look-alikes, a subdomain, http. -->
  <h1>Connexion</h1>
  <form id="login" action="#">
    <label>Identifiant <input id="user" name="user" type="text" autocomplete="username"></label>
    <label>Mot de passe <input id="pass" name="pass" type="password" autocomplete="current-password"></label>
    <button type="submit">Se connecter</button>
  </form>
</body>
</html>
