<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Clés d’accès</title></head>
<body>
  <!-- Served at https://forge.test/passkey: a site that registers a passkey, then signs in
       with it, through navigator.credentials (ADR 0079). -->
  <h1>Clés d’accès</h1>
  <script>
    const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    window.register = async () => {
      const c = await navigator.credentials.create({
        publicKey: {
          rp: { id: 'forge.test', name: 'Forge de test' },
          user: { id: new Uint8Array([7, 7, 7, 7]), name: 'max@forge.test', displayName: 'Max' },
          challenge: new Uint8Array(32).fill(0x42),
          pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
          authenticatorSelection: { residentKey: 'required', userVerification: 'preferred' },
          extensions: { credProps: true },
        },
      });
      return {
        isCredential: c instanceof PublicKeyCredential,
        id: c.id,
        rawId: b64u(c.rawId),
        type: c.type,
        clientData: new TextDecoder().decode(c.response.clientDataJSON),
        authData: b64u(c.response.getAuthenticatorData()),
        publicKey: b64u(c.response.getPublicKey()),
        alg: c.response.getPublicKeyAlgorithm(),
        ext: c.getClientExtensionResults(),
        json: c.toJSON(),
      };
    };
    window.signIn = async () => {
      const a = await navigator.credentials.get({
        publicKey: { challenge: new Uint8Array(32).fill(0x43), rpId: 'forge.test', userVerification: 'preferred' },
      });
      return {
        isCredential: a instanceof PublicKeyCredential,
        id: a.id,
        clientData: b64u(a.response.clientDataJSON),
        clientDataText: new TextDecoder().decode(a.response.clientDataJSON),
        authData: b64u(a.response.authenticatorData),
        signature: b64u(a.response.signature),
        userHandle: b64u(a.response.userHandle),
      };
    };
    window.refused = async () => {
      try {
        await navigator.credentials.get({ publicKey: { challenge: new Uint8Array(32), rpId: 'forge.test' } });
        return 'resolved';
      } catch (e) {
        return e.name;
      }
    };
  </script>
</body>
</html>
