<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Créer un compte</title></head>
<body>
  <!-- Served at https://shop.test/signup: generator, then proposal to save the new login. -->
  <form id="signup" action="#">
    <label>Courriel <input id="user" type="email" autocomplete="username"></label>
    <label>Mot de passe <input id="pass" type="password" autocomplete="new-password"></label>
    <label>Confirmation <input id="pass2" type="password" autocomplete="new-password"></label>
    <button type="submit">Créer</button>
  </form>
</body>
</html>
