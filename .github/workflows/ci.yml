name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        # Installs the toolchain and components pinned in rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustup show
      # aws-lc-rs builds the AWS-LC C library (ADR 0009): CMake on every OS,
      # NASM for the x86-64 assembly on Windows.
      - name: CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"
      - name: NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      # The Argon2 C reference (argon2-kdf, test-only, not built on Windows) runs bindgen,
      # which needs libclang. macOS runners have it through Xcode.
      - name: libclang
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Build tools
        shell: bash
        run: |
          cmake --version
          if [ "$RUNNER_OS" = "Windows" ]; then nasm -v; fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # dudect-style timing test of the Shamir arithmetic (ADR 0012). Shared runners are noisy:
  # the result is informative and never blocks a merge.
  constant-time:
    name: constant time (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - name: dudect
        run: cargo test --release -p hirzla-crypto -- --ignored dudect --nocapture

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  secrets:
    name: no tracked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse tracked vaults, certificates and private keys
        shell: bash
        run: |
          tracked="$(git ls-files -- ':(icase)*.hirzla' ':(icase)*.pem' ':(icase)*.key')"
          if [ -n "$tracked" ]; then
            echo "::error::Files that may hold secrets are tracked by git:"
            echo "$tracked"
            exit 1
          fi
          echo "No *.hirzla, *.pem or *.key file is tracked."
