name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        # Installs the toolchain and components pinned in rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustup show
      # aws-lc-rs builds the AWS-LC C library (ADR 0009): CMake on every OS,
      # NASM for the x86-64 assembly on Windows.
      - name: CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"
      - name: NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      # The Argon2 C reference (argon2-kdf, test-only, not built on Windows) runs bindgen,
      # which needs libclang. macOS runners have it through Xcode.
      # The desktop application (Tauri 2, ADR 0024) needs WebKitGTK 4.1 and GTK 3 on Linux;
      # Windows (WebView2) and macOS (WKWebView) need nothing more to build it.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libclang-dev libssl-dev
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      # tpm2-tss >= 4.1.3 for tss-esapi (ADR 0014): built from its release tarball, pinned by
      # SHA-256 (Ubuntu ships 4.0.1). Found by pkg-config; nothing is downloaded by cargo.
      - name: tpm2-tss
        if: runner.os == 'Linux'
        run: sudo -E .github/scripts/install-tpm2-tss.sh
      - name: Build tools
        shell: bash
        run: |
          cmake --version
          if [ "$RUNNER_OS" = "Windows" ]; then nasm -v; fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --no-fail-fast

  # dudect-style timing test of the Shamir arithmetic (ADR 0012). Shared runners are noisy:
  # the result is informative and never blocks a merge.
  constant-time:
    name: constant time (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - name: dudect
        run: cargo test --release -p hirzla-crypto -- --ignored dudect --nocapture

  # Short fuzzing of the vault decoders (ADR 0013). Informative: never blocks a merge.
  fuzz:
    name: fuzz (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz each decoder for 60 seconds
        working-directory: fuzz
        run: |
          for target in decode_secret_body decode_locker_body decode_header; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60
          done

  # TPM 2.0 prototype (ADR 0014) against swtpm, the software TPM. Real chips are tested by
  # hand (docs/keystore-prototypes.md).
  tpm-swtpm:
    name: TPM prototype (swtpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - name: Build tools and swtpm
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev swtpm swtpm-tools
      - name: tpm2-tss
        run: sudo -E .github/scripts/install-tpm2-tss.sh
      - name: Start swtpm
        run: |
          mkdir -p "$RUNNER_TEMP/swtpm"
          swtpm_setup --tpm2 --tpmstate "$RUNNER_TEMP/swtpm"
          swtpm socket --tpm2 --tpmstate dir="$RUNNER_TEMP/swtpm" --server type=tcp,port=2321 --ctrl type=tcp,port=2322 --flags not-need-init,startup-clear --daemon
      - name: Prototype tests
        env:
          HIRZLA_TPM_TCTI: swtpm:port=2321
        run: >-
          cargo test -p hirzla-keystore --test tpm2_prototype --
          --ignored --nocapture --test-threads=1

  # Interface of the desktop application: type check of the JavaScript (no build step, the
  # checked files are the shipped ones) and fingerprints of the embedded fonts.
  desktop-ui:
    name: desktop interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install (locked)
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run check
      - name: Embedded fonts match their fingerprints
        working-directory: apps/desktop/ui/fonts
        run: sha256sum -c SHA256SUMS

  # Browser extension (step 8): unit tests of its decisions, then the real extension in
  # Chromium (Playwright, new headless mode) against the real native host and core.
  extension:
    name: browser extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev libssl-dev
      - name: tpm2-tss
        working-directory: .
        run: sudo -E .github/scripts/install-tpm2-tss.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencies (locked)
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Core, command line and native host
        working-directory: .
        run: cargo build -p hirzla-core -p hirzla-cli -p hirzla-native-host
      - name: End-to-end tests
        run: npm run test:e2e

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Go SDK of the Hornn agent gateway (step 13): no cryptography, no dependency.
  go-sdk:
    name: Go SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Tests
        run: go test -race ./...
      - name: No dependency
        run: test "$(go list -m all | wc -l)" -eq 1

  secrets:
    name: no tracked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse tracked vaults, certificates and private keys
        shell: bash
        run: |
          tracked="$(git ls-files -- ':(icase)*.hirzla' ':(icase)*.pem' ':(icase)*.key')"
          if [ -n "$tracked" ]; then
            echo "::error::Files that may hold secrets are tracked by git:"
            echo "$tracked"
            exit 1
          fi
          echo "No *.hirzla, *.pem or *.key file is tracked."
