name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "website/**", "brand/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "website/**", "brand/**", "**/*.md"]

permissions:
  contents: read

# A new push to a pull request cancels its previous run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  # Line tables keep file and line in backtraces; full debug info only slows the links and
  # bloats the cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        # Installs the toolchain and components pinned in rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustup show
      # Dependencies only (Cargo home and target/deps). Saved from main alone: pull requests
      # restore it and never write one.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # aws-lc-rs builds the AWS-LC C library (ADR 0009): CMake on every OS,
      # NASM for the x86-64 assembly on Windows.
      - name: CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"
      - name: NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      # The Argon2 C reference (argon2-kdf, test-only, not built on Windows) runs bindgen,
      # which needs libclang. macOS runners have it through Xcode. strace: the test that
      # hirzlad opens no outbound connection traces the binary (ADR 0028, point 10).
      # The desktop application (Tauri 2, ADR 0024) needs WebKitGTK 4.1 and GTK 3 on Linux;
      # Windows (WebView2) and macOS (WKWebView) need nothing more to build it.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: >-
          sudo rm -f /var/lib/man-db/auto-update && sudo apt-get update && sudo apt-get install -y libclang-dev libssl-dev strace
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      # No tpm2-tss here: the TPM prototype is behind the `tpm2-prototype` feature, off by
      # default (ADR 0052), and built only by the « TPM prototype (swtpm) » job.
      - name: Build tools
        shell: bash
        run: |
          cmake --version
          if [ "$RUNNER_OS" = "Windows" ]; then nasm -v; fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        env:
          # Linux: the outbound-connection test of hirzlad must run, not skip.
          HIRZLA_REQUIRE_STRACE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: cargo test --workspace --no-fail-fast

  # TPM 2.0 prototype (ADR 0014) against swtpm, the software TPM. Real chips are tested by
  # hand (docs/keystore-prototypes.md).
  tpm-swtpm:
    name: TPM prototype (swtpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build tools and swtpm
        run: sudo rm -f /var/lib/man-db/auto-update && sudo apt-get update && sudo apt-get install -y cmake libssl-dev swtpm swtpm-tools
      - name: tpm2-tss
        run: sudo -E .github/scripts/install-tpm2-tss.sh
      - name: Start swtpm
        run: |
          mkdir -p "$RUNNER_TEMP/swtpm"
          swtpm_setup --tpm2 --tpmstate "$RUNNER_TEMP/swtpm"
          swtpm socket --tpm2 --tpmstate dir="$RUNNER_TEMP/swtpm" --server type=tcp,port=2321 --ctrl type=tcp,port=2322 --flags not-need-init,startup-clear --daemon
      - name: Prototype tests
        env:
          HIRZLA_TPM_TCTI: swtpm:port=2321
        run: >-
          cargo test -p hirzla-keystore --features tpm2-prototype --test tpm2_prototype --
          --ignored --nocapture --test-threads=1

  # FIDO2 over USB HID on Linux and macOS (ADR 0075 § 8): `ctap-hid-fido2` behind the
  # `fido2-hid` feature, off by default. Built and checked here; real keys are tested by hand
  # (docs/keystore-prototypes.md, test F2).
  fido2-hid:
    name: FIDO2 HID (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo rm -f /var/lib/man-db/auto-update && sudo apt-get update && sudo apt-get install -y libudev-dev libclang-dev
      - name: Clippy
        run: >-
          cargo clippy -p hirzla-keystore -p hirzla-core --all-targets --features
          hirzla-keystore/fido2-hid,hirzla-keystore/test-software -- -D warnings
      - name: Tests
        run: cargo test -p hirzla-keystore --features fido2-hid,test-software --lib

  # Android (ADR 0080): the core, its crates and the Android Keystore factor cross-compiled for
  # arm64 with the NDK of the runner. Libraries only: the tests run on the host; the factor is
  # tested by hand on a Pixel (docs/keystore-prototypes.md, test A1).
  android:
    name: Android (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install && rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Clippy
        run: >-
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -P 34 clippy -p hirzla-keystore -p hirzla-core -p hirzla-crypto
          -p hirzla-vault -p hirzla-access -p hirzla-sync -p hirzla-mobile-core -- -D warnings

  # Interface of the desktop application: type check of the JavaScript (no build step, the
  # checked files are the shipped ones) and fingerprints of the embedded fonts.
  desktop-ui:
    name: desktop interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install (locked)
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run check
      - name: Embedded fonts match their fingerprints
        working-directory: apps/desktop/ui/fonts
        run: sha256sum -c SHA256SUMS

  # Browser extension (step 8): unit tests of its decisions, then the real extension in
  # Chromium (Playwright, new headless mode) against the real native host and core.
  extension:
    name: browser extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build tools
        run: sudo rm -f /var/lib/man-db/auto-update && sudo apt-get update && sudo apt-get install -y cmake libclang-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencies (locked)
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Core, command line and native host
        working-directory: .
        run: cargo build -p hirzla-core -p hirzla-cli -p hirzla-native-host
      - name: End-to-end tests
        run: npm run test:e2e

  # Reproducible build of the Linux executables and their bills of materials (ADR 0056):
  # two builds of the same commit in two directories must give identical binaries. No tool
  # beyond the toolchain and Python's standard library; nothing downloaded after the fetch.
  reproducible:
    name: reproducible build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - name: Build tools
        run: sudo rm -f /var/lib/man-db/auto-update && sudo apt-get update && sudo apt-get install -y cmake libudev-dev
      - name: Crates of Cargo.lock
        run: cargo fetch --locked
      - name: Two builds, compared
        run: .github/scripts/reproducible-build.sh "$RUNNER_TEMP/repro"
      - name: Bills of materials (CycloneDX)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p sbom
          for p in hirzla-core hirzla-cli hirzla-server hirzla-native-host hirzla-desktop; do
            f=(); if [ "$p" = hirzla-core ]; then f=(--features fido2-hid); fi
            .github/scripts/sbom.py "$p" --target x86_64-unknown-linux-gnu "${f[@]}" \
              --output "sbom/$p.cdx.json"
          done
          # npm packages of the desktop interface and of the extension (ADR 0061): read from
          # package-lock.json alone, nothing installed; regenerated once to check determinism.
          for a in desktop extension; do
            .github/scripts/sbom.py --npm "apps/$a" --output "sbom/$a.npm.cdx.json"
            .github/scripts/sbom.py --npm "apps/$a" | cmp - "sbom/$a.npm.cdx.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-linux-x86_64
          path: sbom/*.cdx.json
          if-no-files-found: error

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Go SDK of the Hornn agent gateway (step 13): no cryptography, no dependency.
  go-sdk:
    name: Go SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Tests
        run: go test -race ./...
      - name: No dependency
        run: test "$(go list -m all | wc -l)" -eq 1

  secrets:
    name: no tracked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse tracked vaults, certificates and private keys
        shell: bash
        run: |
          tracked="$(git ls-files -- ':(icase)*.hirzla' ':(icase)*.pem' ':(icase)*.key')"
          if [ -n "$tracked" ]; then
            echo "::error::Files that may hold secrets are tracked by git:"
            echo "$tracked"
            exit 1
          fi
          echo "No *.hirzla, *.pem or *.key file is tracked."
