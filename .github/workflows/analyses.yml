name: Analyses

# Long, informative analyses that never block a merge, moved out of the CI of every pull
# request: the dudect-style timing test of the Shamir arithmetic (ADR 0012) and the short
# fuzzing of every decoder exposed to external data (ADR 0013; inventory in
# docs/evaluation/interfaces.md). They run on every push to main, once a week (toolchain and
# runner drift) and by hand.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "website/**", "brand/**", "**/*.md"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analyses-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  # Shared runners are noisy: the result is informative.
  constant-time:
    name: constant time (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build tools
        run: >-
          sudo rm -f /var/lib/man-db/auto-update &&
          sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - name: dudect
        run: cargo test --release -p hirzla-crypto -- --ignored dudect --nocapture

  fuzz:
    name: fuzz (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - name: Build tools
        run: >-
          sudo rm -f /var/lib/man-db/auto-update &&
          sudo apt-get update && sudo apt-get install -y cmake libclang-dev libssl-dev
      - name: cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz each decoder for 60 seconds
        working-directory: fuzz
        run: |
          status=0
          for target in decode_secret_body decode_locker_body decode_header read_kdbx read_kdbx_payload \
            decode_local_request decode_sync_message decode_operation decode_server_annex \
            decode_release decode_audit_log decode_recovery_share decode_keylog decode_hornn_grant \
            decode_locker_export parse_csv parse_native_json; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60 || status=1
          done
          exit $status
