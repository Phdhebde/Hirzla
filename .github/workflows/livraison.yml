name: Livraison

# Builds the installers of the desktop application (docs/livraison.md): MSI on Windows,
# disk image on macOS, deb, rpm and AppImage on Linux. Started by hand; signing happens only
# when the repository secrets named below exist. No secret value is ever written here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installers:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - name: CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"
      - name: NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libssl-dev
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - name: Tauri CLI (pinned)
        run: cargo install tauri-cli --version 2.12.4 --locked
      # The core and the command line are installed next to hirzla-desktop: the core accepts
      # its clients by path, in its own directory (docs/api-locale.md § 3.1).
      - name: Core and command line
        shell: bash
        run: |
          cargo build --release --locked -p hirzla-core -p hirzla-cli
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          ext=""; if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/release/hirzla-core$ext" "apps/desktop/src-tauri/binaries/hirzla-core-$triple$ext"
          cp "target/release/hirzla$ext" "apps/desktop/src-tauri/binaries/hirzla-$triple$ext"
      - name: Installers
        working-directory: apps/desktop/src-tauri
        env:
          # macOS signing and notarisation (docs/livraison.md § 3). Absent: unsigned build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: cargo tauri build --config tauri.livraison.conf.json
      # Bills of materials of the shipped executables (ADR 0056), offline, deterministic.
      - name: Bills of materials (CycloneDX)
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          py=python3; if [ "$RUNNER_OS" = "Windows" ]; then py=python; fi
          mkdir -p target/release/bundle/sbom
          for p in hirzla-core hirzla-cli hirzla-desktop; do
            "$py" .github/scripts/sbom.py "$p" --target "$triple" \
              --output "target/release/bundle/sbom/$p-$triple.cdx.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hirzla-${{ matrix.os }}
          path: |
            target/release/bundle/sbom/*.cdx.json
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
          if-no-files-found: error
