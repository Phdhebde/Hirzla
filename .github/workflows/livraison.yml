name: Livraison

# Release flow in a single run (ADR 0073, which replaces the offline signing of ADR 0064;
# docs/livraison.md § 2.1, docs/guide-signature.md).
#
# On a pushed tag vX.Y.Z:
#   1. version           the tag equals the workspace version; publisher keys of the mode.
#   2. executables       the release executables of each platform, built ONCE (Cargo feature
#                        `livraison`, mode `manifeste`); macOS: Hirzla.app, ad hoc signed.
#                        They are never rebuilt: the client manifest holds their SHA-384.
#   3. authenticode-exe  optional (vars.SIGNPATH_ORGANIZATION_ID set): Authenticode signature
#                        of the Windows executables by SignPath, BEFORE the manifest is
#                        computed, since any signature changes the files.
#   4. manifests         environment `editeur` (required reviewer: the publisher approves the
#                        deployment): builds hirzla-signer from the tagged commit, signs one
#                        client manifest per platform with the publisher key taken from a
#                        secret, verifies each one against HIRZLA_PUBLISHER_KEYS (the public
#                        keys compiled into the executables) and deletes the key.
#   5. installers        built from those executables unchanged (no rebuild, no strip, no
#                        binary patching), each one opened and checked byte for byte against
#                        the executables and the manifest; macOS: .pkg of the very
#                        Hirzla.app of step 2 (macos-pkg.sh, ADR 0065), no disk image.
#   6. authenticode-msi  optional, like step 3: Authenticode signature of the MSI. It changes
#                        the MSI, not the files inside it, so the manifest stays valid.
#   7. publish           bills of materials, extension, SHA256SUMS, Sigstore provenance, and a
#                        DRAFT release with every file. The publisher signs SHA256SUMS with
#                        GPG, attaches SHA256SUMS.asc and publishes by hand: this workflow
#                        never publishes a release.
#
# Dry run: a tag vX.Y.Z-essai.N runs the same flow for workspace version X.Y.Z, but compiles
# the test keys of HIRZLA_PUBLISHER_KEYS_ESSAI, signs with the secret
# HIRZLA_PUBLISHER_KEY_ESSAI, uses the SignPath test policy, and keeps the GitHub release a
# pre-release draft titled "Essai ...". Its executables trust the test keys only: they must
# never be published (docs/livraison.md § 2.1). release-version.py refuses test keys shared
# with the real ones.
#
# Secrets: HIRZLA_PUBLISHER_KEY (base64 of editeur.cle) and HIRZLA_PUBLISHER_KEY_ESSAI live in
# the protected environment `editeur` and are read by ONE step of the manifests job only;
# SIGNPATH_API_TOKEN lives in the environment `signpath`. HIRZLA_PUBLISHER_KEYS and
# HIRZLA_PUBLISHER_KEYS_ESSAI are repository variables holding public keys; every job takes
# the keys of the mode from the version job, never from the variables directly. No secret
# value is ever written here or echoed to a log.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: livraison-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned Tauri CLI (docs/livraison.md § 2).
  TAURI_CLI_VERSION: "2.12.4"
  CARGO_TERM_COLOR: never

jobs:
  # ---------------------------------------------------------------------------------------
  # The tag, the version and the publisher keys.
  # ---------------------------------------------------------------------------------------
  version:
    name: version and publisher keys
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      # X.Y.Z, or X.Y.Z-essai.N for a dry run.
      label: ${{ steps.check.outputs.label }}
      essai: ${{ steps.check.outputs.essai }}
      # HIRZLA_PUBLISHER_KEYS, or HIRZLA_PUBLISHER_KEYS_ESSAI for a dry run (public keys).
      publisher_keys: ${{ steps.check.outputs.publisher_keys }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag equals the workspace version; publisher keys of the mode are set
        id: check
        env:
          HIRZLA_PUBLISHER_KEYS: ${{ vars.HIRZLA_PUBLISHER_KEYS }}
          HIRZLA_PUBLISHER_KEYS_ESSAI: ${{ vars.HIRZLA_PUBLISHER_KEYS_ESSAI }}
        run: |
          version="$(python3 .github/scripts/release-version.py --tag "$GITHUB_REF_NAME" \
            --publisher-keys --github-output "$GITHUB_OUTPUT")"
          echo "Release $version, tag $GITHUB_REF_NAME, commit $GITHUB_SHA"
          if grep -qx 'essai=true' "$GITHUB_OUTPUT"; then
            echo "::warning::Dry run ($GITHUB_REF_NAME): test publisher keys (HIRZLA_PUBLISHER_KEYS_ESSAI). Never publish this release; delete the draft and the tag afterwards."
          fi

  # ---------------------------------------------------------------------------------------
  # Release executables, built once. They are never modified afterwards, except by the
  # Authenticode signature below, which happens before the manifest is computed.
  # ---------------------------------------------------------------------------------------
  executables:
    name: executables (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            platform: windows-x86_64
            triple: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            platform: macos-aarch64
            triple: aarch64-apple-darwin
            ext: ""
    env:
      # Public publisher keys compiled into the core and its clients (ADR 0042, 0043): the
      # test keys in a dry run.
      HIRZLA_PUBLISHER_KEYS: ${{ needs.version.outputs.publisher_keys }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != "${{ matrix.triple }}" ]; then
            echo "::error::Runner host is $host, expected ${{ matrix.triple }} for ${{ matrix.platform }}."
            exit 1
          fi
      - name: CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"
      - name: NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libssl-dev libudev-dev
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Tauri CLI (pinned)
        run: cargo install tauri-cli --version ${{ env.TAURI_CLI_VERSION }} --locked
      - name: Publisher keys present
        shell: bash
        run: |
          if [ -z "${HIRZLA_PUBLISHER_KEYS// /}" ]; then
            echo "::error::HIRZLA_PUBLISHER_KEYS is empty: a release core would refuse to start."
            exit 1
          fi
      # Reproducible settings of docs/livraison.md § 2 (ADR 0056), Linux only.
      - name: Reproducible build settings (Linux)
        if: runner.os == 'Linux'
        run: |
          {
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
            echo "RUSTFLAGS=--remap-path-prefix=$PWD=/hirzla --remap-path-prefix=$PWD/target=/target --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/rustup"
            echo "CFLAGS=-ffile-prefix-map=$PWD=/hirzla -ffile-prefix-map=${CARGO_HOME:-$HOME/.cargo}=/cargo"
            echo "CXXFLAGS=-ffile-prefix-map=$PWD=/hirzla -ffile-prefix-map=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          } >> "$GITHUB_ENV"
      # Core, command line and native host: feature `livraison`, mode `manifeste` (no
      # `signature-systeme`). The desktop application below gets the same features: a core
      # and clients built differently do not recognise each other (ADR 0063 § 1).
      # FIDO2 security keys over USB HID (ADR 0075, open point 1 decided): the core alone, on
      # Linux and macOS, in an invocation of its own so that hidapi reaches no other executable.
      # Windows uses webauthn.dll. The desktop bundle ships this very core.
      - name: Core, command line and native host
        shell: bash
        run: |
          core=(--features livraison)
          if [ "$RUNNER_OS" != "Windows" ]; then core=(--features livraison,fido2-hid); fi
          cargo build --release --locked -p hirzla-core "${core[@]}"
          cargo build --release --locked -p hirzla-cli -p hirzla-native-host \
            --features hirzla-cli/livraison,hirzla-native-host/livraison
          mkdir -p apps/desktop/src-tauri/binaries
          for n in hirzla-core hirzla hirzla-native-host; do
            cp "target/release/$n${{ matrix.ext }}" \
              "apps/desktop/src-tauri/binaries/$n-${{ matrix.triple }}${{ matrix.ext }}"
          done
      # Compiles hirzla-desktop only: installers are built by the installers job from these
      # files. macOS: Hirzla.app itself (ADR 0065). Its seal covers the executables, so it is
      # signed below and never rebuilt: the installers job wraps this very bundle into the .pkg.
      - name: Desktop application
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then bundle=(--bundles app); else bundle=(--no-bundle); fi
          cargo tauri build "${bundle[@]}" --ci --config tauri.livraison.conf.json \
            --features livraison -- --locked
      - name: Server and audit verifier (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked -p hirzla-server -p hirzla-audit
          mkdir -p out/serveur
          cp target/release/hirzlad target/release/hirzla-audit-verify out/serveur/
      - name: Collect the executables (Linux, Windows)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          dir="out/${{ matrix.platform }}"
          mkdir -p "$dir"
          for n in hirzla hirzla-core hirzla-desktop hirzla-native-host; do
            cp "target/release/$n${{ matrix.ext }}" "$dir/"
          done
      # macOS without an Apple Developer account (docs/livraison.md § 3, ADR 0063 § 5, 0065):
      # final ad hoc signature of Hirzla.app with the hardened runtime, BEFORE the manifest is
      # signed, since any signature changes the files. Nested executables first, then the
      # bundle (main executable and seal). Nothing changes the bundle afterwards: the zip
      # below carries it to the manifests job, which hashes Contents/MacOS/* as signed, and
      # to the installers job, which puts it in the .pkg as it is.
      - name: Ad hoc signature of Hirzla.app, hardened runtime (macOS)
        if: runner.os == 'macOS'
        run: |
          app=target/release/bundle/macos/Hirzla.app
          ls -l "$app/Contents/MacOS"
          for n in hirzla hirzla-core hirzla-native-host; do
            codesign --force --sign - --options runtime "$app/Contents/MacOS/$n"
          done
          codesign --force --deep --sign - --options runtime "$app"
          codesign --verify --strict --deep --verbose=2 "$app"
          dir="out/${{ matrix.platform }}"
          mkdir -p "$dir"
          ditto -c -k --norsrc --keepParent "$app" "$dir/Hirzla.app.zip"
      - name: Fingerprints
        shell: bash
        run: |
          cd out
          if command -v sha256sum > /dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
          $sum ${{ matrix.platform }}/* | tee "${{ matrix.platform }}.sha256"
      - name: Build provenance of the executables (Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/${{ matrix.platform }}/*
      - name: Build provenance of the server (Sigstore)
        if: runner.os == 'Linux'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/serveur/*
      - uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.platform }}
          path: |
            out/${{ matrix.platform }}/
            out/${{ matrix.platform }}.sha256
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: serveur-linux-x86_64
          path: out/serveur/
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------------------
  # Optional: Authenticode signature of the Windows executables by the SignPath Foundation
  # (ADR 0063 § 4, ADR 0073). Skipped when vars.SIGNPATH_ORGANIZATION_ID is empty: the
  # Windows files then stay unsigned (SmartScreen warning) and the flow still completes.
  # Output: the artifact "executables-windows-x86_64-signes", same layout as the unsigned
  # "executables-windows-x86_64". The manifest is computed afterwards, on these files.
  # ---------------------------------------------------------------------------------------
  authenticode-exe:
    name: Authenticode, Windows executables (SignPath)
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    needs: [version, executables]
    runs-on: ubuntu-24.04
    environment: signpath
    permissions:
      contents: read
      # SignPath downloads the artifact and checks the run with the job token.
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: executables-windows-x86_64
          path: unsigned
      - name: Unsigned executables
        run: |
          cd unsigned
          sha256sum -c windows-x86_64.sha256
          got="$(cd windows-x86_64 && find . -type f -printf '%P\n' | LC_ALL=C sort | xargs)"
          if [ "$got" != "hirzla-core.exe hirzla-desktop.exe hirzla-native-host.exe hirzla.exe" ]; then
            echo "::error::Unexpected Windows executables: $got"
            exit 1
          fi
      # The four .exe at the root of a new artifact of this run: SignPath signs the
      # artifact it is given by id (artifact configuration "executables").
      - name: Executables to sign
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: authenticode-exe-a-signer
          path: unsigned/windows-x86_64/
          if-no-files-found: error
          retention-days: 1
      - name: Authenticode signature (SignPath)
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ needs.version.outputs.essai == 'true' && (vars.SIGNPATH_TEST_POLICY_SLUG || 'test-signing') || (vars.SIGNPATH_POLICY_SLUG || 'release-signing') }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_CONFIG_SLUG || 'executables' }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          # A release signing policy may wait for a manual approval in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-exe
      - name: Signed executables, same layout as the unsigned artifact
        run: |
          got="$(cd signed-exe && find . -type f -printf '%P\n' | LC_ALL=C sort | xargs)"
          if [ "$got" != "hirzla-core.exe hirzla-desktop.exe hirzla-native-host.exe hirzla.exe" ]; then
            echo "::error::SignPath returned unexpected files: $got"
            exit 1
          fi
          mkdir -p out/windows-x86_64
          for n in hirzla.exe hirzla-core.exe hirzla-desktop.exe hirzla-native-host.exe; do
            if cmp -s "signed-exe/$n" "unsigned/windows-x86_64/$n"; then
              echo "::error::$n came back from SignPath unchanged: not signed."
              exit 1
            fi
            cp "signed-exe/$n" out/windows-x86_64/
          done
          cd out
          sha256sum windows-x86_64/* | tee windows-x86_64.sha256
      - name: Build provenance of the signed executables (Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/windows-x86_64/*
      - uses: actions/upload-artifact@v4
        with:
          name: executables-windows-x86_64-signes
          path: |
            out/windows-x86_64/
            out/windows-x86_64.sha256
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------------------
  # Client manifests, signed with the publisher key (ADR 0073). Environment `editeur`: the
  # job waits for the publisher's approval, and only tags v* may deploy to it. This is the
  # only job that sees the key, and only its signing step: the key is decoded into
  # $RUNNER_TEMP (umask 077), read by hirzla-signer alone and deleted at the end of the step.
  # ---------------------------------------------------------------------------------------
  manifests:
    name: client manifests (publisher key)
    needs: [version, executables, authenticode-exe]
    if: >-
      !cancelled() && needs.executables.result == 'success' &&
      (needs.authenticode-exe.result == 'success' || needs.authenticode-exe.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: editeur
    permissions:
      contents: read
    outputs:
      # Artifact of the Windows executables named by the manifest: signed when
      # authenticode-exe ran.
      windows_executables: ${{ steps.windows.outputs.name }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ESSAI: ${{ needs.version.outputs.essai }}
      HIRZLA_PUBLISHER_KEYS: ${{ needs.version.outputs.publisher_keys }}
    steps:
      - name: Windows executables of the manifest
        id: windows
        env:
          AUTHENTICODE: ${{ needs.authenticode-exe.result }}
        run: |
          if [ "$AUTHENTICODE" = "success" ]; then
            echo "name=executables-windows-x86_64-signes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SignPath not configured (vars.SIGNPATH_ORGANIZATION_ID): Windows files are not Authenticode-signed."
            echo "name=executables-windows-x86_64" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: executables-linux-x86_64
          path: stage1
      - uses: actions/download-artifact@v4
        with:
          name: executables-macos-aarch64
          path: stage1
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.windows.outputs.name }}
          path: stage1
      - name: Executables of this run
        run: |
          cd stage1
          for p in linux-x86_64 windows-x86_64 macos-aarch64; do
            sha256sum -c "$p.sha256"
          done
      # macOS (ADR 0065): the manifest names the executables of Hirzla.app/Contents/MacOS as
      # they are in the signed bundle, and nothing else.
      - name: Signed Hirzla.app, unzipped (macOS)
        run: |
          mkdir stage1/app-macos-aarch64
          unzip -q stage1/macos-aarch64/Hirzla.app.zip -d stage1/app-macos-aarch64
          for f in stage1/app-macos-aarch64/Hirzla.app/Contents/MacOS/* \
            stage1/app-macos-aarch64/Hirzla.app/Contents/MacOS/.[!.]*; do
            [ -e "$f" ] || continue
            case "$(basename "$f")" in
              hirzla | hirzla-core | hirzla-desktop | hirzla-native-host) ;;
              *) echo "::error::Unexpected file in Contents/MacOS: $(basename "$f")"; exit 1 ;;
            esac
          done
      - name: Toolchain
        run: rustup toolchain install
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y cmake
      # From the tagged commit, before the key is decoded.
      - name: hirzla-signer
        run: cargo build --locked --release -p hirzla-release-signer
      # The only step that sees the key. Same commands as .github/scripts/signer-manifestes.sh.
      # Each expression is empty outside its mode: a dry run never gets the real key.
      - name: Sign the client manifests
        shell: bash
        env:
          KEY_B64_REAL: ${{ needs.version.outputs.essai != 'true' && secrets.HIRZLA_PUBLISHER_KEY || '' }}
          KEY_B64_ESSAI: ${{ needs.version.outputs.essai == 'true' && secrets.HIRZLA_PUBLISHER_KEY_ESSAI || '' }}
        run: |
          set +x
          umask 077
          key="$RUNNER_TEMP/editeur.cle"
          trap 'rm -f "$key"' EXIT
          if [ "$ESSAI" = "true" ]; then
            name=HIRZLA_PUBLISHER_KEY_ESSAI key_b64="$KEY_B64_ESSAI"
          else
            name=HIRZLA_PUBLISHER_KEY key_b64="$KEY_B64_REAL"
          fi
          unset KEY_B64_REAL KEY_B64_ESSAI
          if [ -z "$key_b64" ]; then
            echo "::error::The secret $name of the environment 'editeur' is empty or missing (docs/guide-signature.md)."
            exit 1
          fi
          if ! printf '%s' "$key_b64" | tr -d ' \r\n' | base64 -d > "$key" 2> /dev/null; then
            echo "::error::The secret $name is not valid base64 (base64 of editeur.cle, docs/guide-signature.md)."
            exit 1
          fi
          unset key_b64
          signer="$GITHUB_WORKSPACE/target/release/hirzla-signer"
          mkdir -p signed
          for p in linux-x86_64 windows-x86_64 macos-aarch64; do
            ext=""
            exe="stage1/$p"
            case "$p" in
              windows-*) ext=".exe" ;;
              macos-*) exe="stage1/app-$p/Hirzla.app/Contents/MacOS" ;;
            esac
            echo "Client manifest $VERSION for $p"
            "$signer" manifeste-clients --cle "$key" --version "$VERSION" --plateforme "$p" \
              --sortie "signed/hirzla-clients-$p.manifest" \
              "$exe/hirzla$ext" "$exe/hirzla-core$ext" \
              "$exe/hirzla-desktop$ext" "$exe/hirzla-native-host$ext"
          done
      - name: Delete the key
        if: always()
        run: rm -f "$RUNNER_TEMP/editeur.cle"
      # Signature (both components) by a key of HIRZLA_PUBLISHER_KEYS, the public keys
      # compiled into the executables: proves that the secret matches them. Then version,
      # platform, and exactly the four executables, same sizes and SHA-384.
      - name: Verify the manifests
        run: |
          signer=target/release/hirzla-signer
          for p in linux-x86_64 windows-x86_64 macos-aarch64; do
            exe="stage1/$p"
            case "$p" in macos-*) exe="stage1/app-$p/Hirzla.app/Contents/MacOS" ;; esac
            "$signer" verifier --cles-hex "$HIRZLA_PUBLISHER_KEYS" --version "$VERSION" \
              --plateforme "$p" --executables "$exe" "signed/hirzla-clients-$p.manifest"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: signed
          path: signed/
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------
  # Installers from the executables named by the manifests, unchanged.
  # ---------------------------------------------------------------------------------------
  installers:
    name: installers (${{ matrix.platform }})
    needs: [version, manifests]
    if: ${{ !cancelled() && needs.manifests.result == 'success' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            ext: ""
            bundles: deb,rpm,appimage
            manifest_config: tauri.manifeste.linux.conf.json
          - os: windows-latest
            platform: windows-x86_64
            triple: x86_64-pc-windows-msvc
            ext: ".exe"
            bundles: msi
            manifest_config: tauri.manifeste.windows.conf.json
          # macOS: no `tauri bundle`; the .pkg wraps the Hirzla.app of the executables job
          # (ADR 0065).
          - os: macos-latest
            platform: macos-aarch64
            triple: aarch64-apple-darwin
            ext: ""
            bundles: ""
            manifest_config: ""
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HIRZLA_PUBLISHER_KEYS: ${{ needs.version.outputs.publisher_keys }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - name: Linux tools
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          rpm cpio
      - name: Tauri CLI (pinned)
        if: runner.os != 'macOS'
        run: cargo install tauri-cli --version ${{ env.TAURI_CLI_VERSION }} --locked
      # Windows: the Authenticode-signed executables when SignPath signed them, the very
      # files the manifest names.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.platform == 'windows-x86_64' && needs.manifests.outputs.windows_executables || format('executables-{0}', matrix.platform) }}
          path: stage1
      - uses: actions/download-artifact@v4
        with:
          name: signed
          path: signed
      # The executables go where `tauri bundle` takes them, byte for byte; `expected/` keeps
      # the reference copy, with the manifest, for the check below.
      - name: Place the executables and the manifest
        if: runner.os != 'macOS'
        shell: bash
        run: |
          src="stage1/${{ matrix.platform }}"
          chmod +x "$src"/* || true
          mkdir -p target/release apps/desktop/src-tauri/binaries expected
          cp -p "$src/hirzla-desktop${{ matrix.ext }}" "target/release/hirzla-desktop${{ matrix.ext }}"
          for n in hirzla-core hirzla hirzla-native-host; do
            cp -p "$src/$n${{ matrix.ext }}" \
              "apps/desktop/src-tauri/binaries/$n-${{ matrix.triple }}${{ matrix.ext }}"
          done
          cp -p "$src"/* expected/
          m="signed/hirzla-clients-${{ matrix.platform }}.manifest"
          if [ -f "$m" ]; then
            cp "$m" apps/desktop/src-tauri/binaries/hirzla-clients.manifest
            cp "$m" expected/hirzla-clients.manifest
          fi
      # --no-binary-patching: Tauri would otherwise rewrite hirzla-desktop to record the
      # bundle type (used by its updater, which Hirzla does not ship). NO_STRIP: linuxdeploy
      # must not strip the AppImage executables.
      - name: Installers
        if: runner.os != 'macOS'
        shell: bash
        working-directory: apps/desktop/src-tauri
        env:
          NO_STRIP: "true"
        run: |
          configs=(--config tauri.livraison.conf.json)
          if [ -n "${{ matrix.manifest_config }}" ]; then
            configs+=(--config "${{ matrix.manifest_config }}")
          fi
          cargo tauri bundle --ci --no-binary-patching --features livraison \
            --bundles "${{ matrix.bundles }}" "${configs[@]}"
      # Every installer must hold the signed executables and their manifest, unchanged, in
      # one directory. deb, rpm and MSI: a mismatch fails the release. AppImage: linuxdeploy
      # may rewrite ELF files; a mismatching AppImage is dropped with a warning (ADR 0064).
      - name: Check the installers (Linux)
        if: runner.os == 'Linux'
        run: |
          b=target/release/bundle
          x="$RUNNER_TEMP/extract"
          mkdir -p "$x/deb" "$x/rpm" "$x/appimage"
          dpkg-deb -x $b/deb/*.deb "$x/deb"
          .github/scripts/compare-installed.sh deb expected "$x/deb/usr/bin" ""
          rpm_file="$(realpath $b/rpm/*.rpm)"
          (cd "$x/rpm" && rpm2cpio "$rpm_file" | cpio -idm --quiet)
          .github/scripts/compare-installed.sh rpm expected "$x/rpm/usr/bin" ""
          appimage="$(realpath $b/appimage/*.AppImage)"
          chmod +x "$appimage"
          (cd "$x/appimage" && "$appimage" --appimage-extract > /dev/null)
          if ! .github/scripts/compare-installed.sh AppImage expected \
              "$x/appimage/squashfs-root/usr/bin" "" warning; then
            echo "::warning::The AppImage does not hold the signed executables unchanged: it is not published."
            rm -f "$appimage"
          fi
      - name: Extract the MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP 'msi-extract'
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$dest`"")
          if ($p.ExitCode -ne 0) { throw "msiexec /a failed: $($p.ExitCode)" }
      - name: Check the MSI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          root="$(cygpath -u "$RUNNER_TEMP")/msi-extract"
          core="$(find "$root" -name hirzla-core.exe | head -n 1)"
          if [ -z "$core" ]; then
            echo "::error::hirzla-core.exe not found in the MSI"
            exit 1
          fi
          .github/scripts/compare-installed.sh MSI expected "$(dirname "$core")" .exe
      # macOS (ADR 0065): the Hirzla.app of the executables job, unzipped as signed, its
      # manifest verified again here against the very executables that go into the .pkg,
      # then the .pkg that installs Hirzla.app into /Applications and the manifest, owned by
      # root, into /Library/Application Support/Hirzla/.
      - name: CMake (macOS)
        if: runner.os == 'macOS'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"
      - name: hirzla-signer (macOS)
        if: runner.os == 'macOS'
        run: cargo build --locked -p hirzla-release-signer
      - name: Signed Hirzla.app and its manifest (macOS)
        if: runner.os == 'macOS'
        run: |
          app_dir="$RUNNER_TEMP/app"
          mkdir -p "$app_dir"
          ditto -x -k "stage1/${{ matrix.platform }}/Hirzla.app.zip" "$app_dir"
          app="$app_dir/Hirzla.app"
          codesign --verify --strict --deep --verbose=2 "$app"
          m="signed/hirzla-clients-${{ matrix.platform }}.manifest"
          target/debug/hirzla-signer verifier --cles-hex "$HIRZLA_PUBLISHER_KEYS" \
            --version "$VERSION" --plateforme "${{ matrix.platform }}" \
            --executables "$app/Contents/MacOS" "$m"
          mkdir -p expected
          cp -p "$app/Contents/MacOS/"* expected/
          cp "$m" expected/hirzla-clients.manifest
          echo "APP=$app" >> "$GITHUB_ENV"
      - name: Installer .pkg (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cd out
          "$GITHUB_WORKSPACE/.github/scripts/macos-pkg.sh" "$APP" \
            "$GITHUB_WORKSPACE/expected/hirzla-clients.manifest" "$VERSION"
      # Like the other installers: the .pkg must hold the signed executables and the manifest
      # byte for byte, and the bundle it installs must still verify.
      - name: Check the .pkg (macOS)
        if: runner.os == 'macOS'
        run: |
          x="$RUNNER_TEMP/pkg-extract"
          inst="$RUNNER_TEMP/pkg-installed"
          pkgutil --expand-full out/Hirzla_"$VERSION"_*.pkg "$x"
          mkdir -p "$inst"
          cp -p "$x/hirzla-app.pkg/Payload/Hirzla.app/Contents/MacOS/"* "$inst/"
          cp -p "$x/hirzla-manifest.pkg/Payload/hirzla-clients.manifest" "$inst/"
          .github/scripts/compare-installed.sh pkg expected "$inst" ""
          codesign --verify --strict --deep --verbose=2 "$x/hirzla-app.pkg/Payload/Hirzla.app"
      - uses: actions/download-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: serveur-linux-x86_64
          path: serveur
      - name: Command line and server archives (Linux)
        if: runner.os == 'Linux'
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          tarball() {  # tarball NAME: deterministic .tar.gz of the folder NAME
            tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
              --format=gnu -cf - "$1" | gzip -n -9 > "out/$1.tar.gz"
          }
          mkdir -p out
          cli="hirzla-cli-$VERSION-linux-x86_64"
          mkdir -p "$cli/native-host-manifests"
          cp expected/hirzla expected/hirzla-core expected/hirzla-native-host \
            expected/hirzla-clients.manifest LICENSE NOTICE "$cli/"
          cp apps/extension/native-host-manifests/*.json "$cli/native-host-manifests/"
          srv="hirzlad-$VERSION-linux-x86_64"
          mkdir -p "$srv"
          cp serveur/hirzlad serveur/hirzla-audit-verify LICENSE NOTICE "$srv/"
          find "$cli" "$srv" -type f -exec chmod 0644 {} +
          find "$cli" "$srv" -type d -exec chmod 0755 {} +
          chmod 0755 "$cli/hirzla" "$cli/hirzla-core" "$cli/hirzla-native-host" \
            "$srv/hirzlad" "$srv/hirzla-audit-verify"
          tarball "$cli"
          tarball "$srv"
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          shopt -s nullglob
          for f in target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm \
            target/release/bundle/appimage/*.AppImage target/release/bundle/msi/*.msi; do
            cp "$f" out/
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: out/
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------
  # Optional, like authenticode-exe: Authenticode signature of the MSI, after the bundle. It
  # changes the MSI file, not the executables inside it, so the manifest stays valid.
  # Output: the artifact "installers-windows-x86_64-signes" (the signed MSI only).
  # ---------------------------------------------------------------------------------------
  authenticode-msi:
    name: Authenticode, MSI (SignPath)
    needs: [version, installers]
    if: >-
      !cancelled() && vars.SIGNPATH_ORGANIZATION_ID != '' && needs.installers.result == 'success'
    runs-on: ubuntu-24.04
    environment: signpath
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers-windows-x86_64
          path: unsigned
      - name: MSI to sign
        run: |
          shopt -s nullglob
          msi=(unsigned/*.msi)
          if [ "${#msi[@]}" -ne 1 ]; then
            echo "::error::Expected one MSI in installers-windows-x86_64, found ${#msi[@]}."
            exit 1
          fi
          echo "MSI=$(basename "${msi[0]}")" >> "$GITHUB_ENV"
      - name: Upload for SignPath
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: authenticode-msi-a-signer
          path: unsigned/${{ env.MSI }}
          if-no-files-found: error
          retention-days: 1
      - name: Authenticode signature (SignPath)
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ needs.version.outputs.essai == 'true' && (vars.SIGNPATH_TEST_POLICY_SLUG || 'test-signing') || (vars.SIGNPATH_POLICY_SLUG || 'release-signing') }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_MSI_CONFIG_SLUG || 'msi' }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-msi
      - name: Signed MSI
        run: |
          got="$(cd signed-msi && find . -type f -printf '%P\n' | xargs)"
          if [ "$got" != "$MSI" ]; then
            echo "::error::SignPath returned unexpected files: $got"
            exit 1
          fi
          if cmp -s "signed-msi/$MSI" "unsigned/$MSI"; then
            echo "::error::$MSI came back from SignPath unchanged: not signed."
            exit 1
          fi
          ls -l signed-msi
      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows-x86_64-signes
          path: signed-msi/${{ env.MSI }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------
  # Bills of materials, extension, fingerprints, provenance, and the draft release.
  # ---------------------------------------------------------------------------------------
  publish:
    name: draft release
    needs: [version, manifests, installers, authenticode-msi]
    if: >-
      !cancelled() && needs.manifests.result == 'success' && needs.installers.result == 'success' &&
      (needs.authenticode-msi.result == 'success' || needs.authenticode-msi.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      # Creates and fills the draft; GitHub shows drafts to writers only.
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      LABEL: ${{ needs.version.outputs.label }}
      ESSAI: ${{ needs.version.outputs.essai }}
      AUTHENTICODE: ${{ needs.authenticode-msi.result == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install
      - name: Crates of Cargo.lock
        run: cargo fetch --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dl
      - uses: actions/download-artifact@v4
        with:
          name: signed
          path: release
      # The three platforms; macOS as a .pkg, never a disk image (ADR 0065). Windows: the
      # Authenticode-signed MSI when SignPath signed it, under the same name.
      - name: Installers and archives
        run: |
          mkdir -p release
          for p in linux-x86_64 windows-x86_64 macos-aarch64; do
            if [ ! -d "dl/installers-$p" ]; then
              echo "::error::installers of $p missing"
              exit 1
            fi
            cp dl/installers-$p/* release/
          done
          if [ "$AUTHENTICODE" = "true" ]; then
            shopt -s nullglob
            msi=(dl/installers-windows-x86_64-signes/*.msi)
            if [ "${#msi[@]}" -ne 1 ] || [ ! -f "release/$(basename "${msi[0]}")" ]; then
              echo "::error::Signed MSI missing or renamed."
              exit 1
            fi
            cp -f "${msi[0]}" release/
          fi
          ls -l release
      - name: Browser extension
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          python3 - "apps/extension/src" "release/hirzla-extension-$VERSION.zip" <<'EOF'
          # Deterministic zip of the extension: sorted names, fixed time and permissions.
          import os, sys, time, zipfile
          src, out = sys.argv[1], sys.argv[2]
          when = time.gmtime(max(int(os.environ["SOURCE_DATE_EPOCH"]), 315532800))[:6]
          names = sorted(
              os.path.relpath(os.path.join(d, f), src).replace(os.sep, "/")
              for d, _, files in os.walk(src) for f in files
          )
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for n in names:
                  info = zipfile.ZipInfo(n, when)
                  info.external_attr = 0o644 << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  with open(os.path.join(src, n), "rb") as f:
                      z.writestr(info, f.read())
          print(out, len(names), "files")
          EOF
      # Offline, deterministic (ADR 0056, 0061): crates linked into each executable for each
      # platform whose manifest was signed, and the npm packages of the interface and the
      # extension.
      - name: Bills of materials (CycloneDX)
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          for m in release/hirzla-clients-*.manifest; do
            p="${m#release/hirzla-clients-}"; p="${p%.manifest}"
            case "$p" in
              linux-x86_64) t=x86_64-unknown-linux-gnu ;;
              windows-x86_64) t=x86_64-pc-windows-msvc ;;
              macos-aarch64) t=aarch64-apple-darwin ;;
              *) echo "::error::unknown platform $p"; exit 1 ;;
            esac
            for pkg in hirzla-core hirzla-cli hirzla-native-host hirzla-desktop; do
              f=(); if [ "$pkg" = hirzla-core ] && [ "$p" != windows-x86_64 ]; then f=(--features fido2-hid); fi
              .github/scripts/sbom.py "$pkg" --target "$t" "${f[@]}" --output "release/$pkg-$p.cdx.json"
            done
          done
          for pkg in hirzla-server hirzla-audit; do
            .github/scripts/sbom.py "$pkg" --target x86_64-unknown-linux-gnu \
              --output "release/$pkg-linux-x86_64.cdx.json"
          done
          for a in desktop extension; do
            .github/scripts/sbom.py --npm "apps/$a" --output "release/$a.npm.cdx.json"
          done
      - name: SHA256SUMS
        run: |
          cd release
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance (Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*
      # One draft per tag. A re-run replaces every file of an existing draft; a published
      # release is never touched (a published version is never rebuilt). A dry run (tag
      # vX.Y.Z-essai.N) is a pre-release draft titled "Essai ...", with a visible warning in
      # its notes: it carries the test keys and is never published.
      - name: Draft release
        run: |
          notes=() title="Hirzla $VERSION" prerelease=()
          if [ "$ESSAI" = "true" ]; then
            notes+=(--essai) title="Essai Hirzla $LABEL (ne pas publier)" prerelease=(--prerelease)
          fi
          if [ "$AUTHENTICODE" = "true" ]; then
            notes+=(--authenticode)
          fi
          python3 .github/scripts/release-notes.py --version "$VERSION" \
            ${notes[@]+"${notes[@]}"} --output notes.md
          if state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$state" != "true" ]; then
              echo "::error::Release $GITHUB_REF_NAME is already published: a published version is never rebuilt. If it was published by mistake, delete it (keep the tag) and re-run this workflow (docs/guide-signature.md)."
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --title "$title" \
              --draft=true ${prerelease[@]+"${prerelease[@]}"}
            for a in $(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'); do
              echo "Removing stale asset $a"
              gh release delete-asset "$GITHUB_REF_NAME" "$a" --yes
            done
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              ${prerelease[@]+"${prerelease[@]}"} --title "$title" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          if [ "$ESSAI" = "true" ]; then
            {
              echo "### Essai à blanc terminé : brouillon complet, À NE JAMAIS PUBLIER"
              echo
              echo "1. Examinez le brouillon $GITHUB_REF_NAME et ses fichiers (clés d'éditeur de test)."
              echo "2. Supprimez-le avec son étiquette : \`gh release delete $GITHUB_REF_NAME --cleanup-tag --yes\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Brouillon complet : Hirzla $VERSION"
            echo
            if [ "$AUTHENTICODE" = "true" ]; then
              echo "Fichiers Windows signés Authenticode (SignPath)."
            else
              echo "Fichiers Windows sans signature Authenticode (SignPath non configuré)."
            fi
            echo
            echo "1. Téléchargez \`SHA256SUMS\` du brouillon $GITHUB_REF_NAME."
            echo "2. \`gpg --detach-sign --armor SHA256SUMS\`, puis \`gpg --verify SHA256SUMS.asc SHA256SUMS\`."
            echo "3. Joignez \`SHA256SUMS.asc\` au brouillon, relisez les notes, puis **Publish release**."
          } >> "$GITHUB_STEP_SUMMARY"
